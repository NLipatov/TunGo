name: Main Workflow
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - '.github/tests/tunnel/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - '.github/tests/tunnel/**'

env:
  GO_VERSION: '1.27.0'
  GOTOOLCHAIN: 'local'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          cd src
          go mod tidy

      - name: Run tests with coverage
        run: |
          cd src
          # preserve env so sudo uses the same Go toolchain
          sudo --preserve-env=PATH,GOROOT,GOTOOLCHAIN \
            env GOTOOLCHAIN=local \
            go test -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/coverage.txt
          flags: unittests
          fail_ci_if_error: true

  cross-compile-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cross-compile test packages (${{ matrix.goos }}/${{ matrix.goarch }})
        run: |
          cd src
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go test -run '^$' -exec /usr/bin/true ./...

  tunnel-e2e:
    name: Tunnel E2E (${{ matrix.arch }}, ${{ matrix.protocol }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        protocol: [UDP, TCP, WS]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Test real TUN traffic and cleanup
        env:
          PROTOCOL: ${{ matrix.protocol }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          ARTIFACT_DIR: ${{ runner.temp }}/tungo-e2e
        run: bash .github/tests/tunnel/run.sh "$PROTOCOL"

      - name: Upload tunnel diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tunnel-e2e-${{ matrix.arch }}-${{ matrix.protocol }}
          path: ${{ runner.temp }}/tungo-e2e
          if-no-files-found: warn
          retention-days: 7

  tunnel-vm-images:
    name: Tunnel VM image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Build native Linux guest from this checkout
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) test "$EXPECTED_ARCH" = amd64 ;;
            aarch64) test "$EXPECTED_ARCH" = arm64 ;;
            *) exit 1 ;;
          esac
          go_version=$(awk '$1 == "go" { print $2; exit }' src/go.mod)
          docker build --build-arg "GO_VERSION=$go_version" \
            --file .github/tests/tunnel/vm/Dockerfile \
            --output "type=local,dest=$RUNNER_TEMP/tungo-vm" .
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tunnel-vm-${{ matrix.arch }}
          path: ${{ runner.temp }}/tungo-vm
          if-no-files-found: error
          retention-days: 1

  tunnel-compatibility:
    name: Tunnel (${{ matrix.client.os }}/${{ matrix.client.arch }} -> Linux/${{ matrix.server_arch }}, ${{ matrix.protocol }})
    needs: tunnel-vm-images
    runs-on: ${{ matrix.client.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        client:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
          - {os: windows, arch: arm64, runner: windows-11-arm}
        server_arch: [amd64, arm64]
        protocol: [UDP, TCP, WS]
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: tunnel-vm-${{ matrix.server_arch }}
          path: ${{ runner.temp }}/tungo-vm
      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: src/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.client.arch == 'amd64' && 'x64' || 'arm64' }}
      - name: Install Linux QEMU and network tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm iproute2 iptables iputils-ping
      - name: Install macOS QEMU
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Install native Windows QEMU and Wintun
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLIENT_ARCH: ${{ matrix.client.arch }}
        run: .github/tests/tunnel/vm/setup-windows.ps1 -Architecture $env:CLIENT_ARCH
      - name: Build native client
        shell: bash
        env:
          CLIENT_OS: ${{ matrix.client.os }}
          CLIENT_ARCH: ${{ matrix.client.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)" = "$CLIENT_OS"
          test "$(go env GOHOSTARCH)" = "$CLIENT_ARCH"
          binary="$RUNNER_TEMP/tungo-client"
          if [[ "$CLIENT_OS" == windows ]]; then binary="$binary.exe"; fi
          cd src
          go build -trimpath -buildvcs=false -tags "netgo,osusergo" -ldflags="-s -w" -o "$binary" .
      - name: Test native Unix client against Linux VM
        if: runner.os != 'Windows'
        env:
          CLIENT_ARCH: ${{ matrix.client.arch }}
          SERVER_ARCH: ${{ matrix.server_arch }}
          PROTOCOL: ${{ matrix.protocol }}
        run: |
          sudo env "PATH=$PATH" GITHUB_ACTIONS=true python .github/tests/tunnel/vm/run.py \
            --client-arch "$CLIENT_ARCH" --server-arch "$SERVER_ARCH" --protocol "$PROTOCOL" \
            --image-dir "$RUNNER_TEMP/tungo-vm" --binary "$RUNNER_TEMP/tungo-client" \
            --artifacts "$RUNNER_TEMP/tungo-compatibility"
      - name: Test native Windows client against Linux VM
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CLIENT_ARCH: ${{ matrix.client.arch }}
          SERVER_ARCH: ${{ matrix.server_arch }}
          PROTOCOL: ${{ matrix.protocol }}
        run: |
          python .github/tests/tunnel/vm/run.py `
            --client-arch $env:CLIENT_ARCH --server-arch $env:SERVER_ARCH --protocol $env:PROTOCOL `
            --image-dir "$env:RUNNER_TEMP/tungo-vm" --binary "$env:RUNNER_TEMP/tungo-client.exe" `
            --artifacts "$env:RUNNER_TEMP/tungo-compatibility"
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tunnel-${{ matrix.client.os }}-${{ matrix.client.arch }}-server-${{ matrix.server_arch }}-${{ matrix.protocol }}
          path: ${{ runner.temp }}/tungo-compatibility
          if-no-files-found: warn
          retention-days: 7

  version-and-tag:
    runs-on: ubuntu-latest
    needs: [run-tests, cross-compile-tests, tunnel-e2e, tunnel-compatibility]
    if: github.event_name == 'push' # Prevents this job from running in PR. It will only run on push to main.
    concurrency:
      group: ${{ github.workflow }}-version-and-tag-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      semver: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.8.x'

      - name: Generate Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Tag and Push Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          git push origin "HEAD:refs/tags/$VERSION"
