name: Main Workflow
concurrency:
  group: main-workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/tunnel-e2e.yml'
      - '.github/tests/tunnel/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/main.yml'
      - '.github/workflows/tunnel-e2e.yml'
      - '.github/tests/tunnel/**'

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: 'local'

jobs:
  run-tests:
    name: Run tests (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-2025
          - os: windows
            arch: arm64
            runner: windows-11-arm
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: darwin
            arch: amd64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-15
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: |
          cd src
          go mod tidy

      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
          # The UDP source regression test needs a second local IPv6 address
          sudo ip -6 addr add fd00::2/128 dev lo nodad
          cd src
          # preserve env so sudo uses the same Go toolchain
          sudo --preserve-env=PATH,GOROOT,GOTOOLCHAIN \
            env GOTOOLCHAIN=local \
            go test -coverprofile=coverage.txt ./...

      - name: Run tests (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        working-directory: src
        run: go test -coverprofile=coverage.txt ./...

      - name: Test tunnel harness
        if: runner.os == 'Linux'
        working-directory: .github/tests/tunnel/harness
        run: go test -race ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: src/coverage.txt
          flags: unittests
          fail_ci_if_error: true

  tunnel-e2e:
    uses: ./.github/workflows/tunnel-e2e.yml

  version-and-tag:
    runs-on: ubuntu-latest
    needs: [run-tests, tunnel-e2e]
    if: github.event_name == 'push' # Prevents this job from running in PR. It will only run on push to main.
    concurrency:
      group: ${{ github.workflow }}-version-and-tag-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      semver: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: Get repository code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.8.x'

      - name: Generate Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Tag and Push Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.gitversion.outputs.majorMinorPatch }}"
          git push origin "HEAD:refs/tags/$VERSION"
